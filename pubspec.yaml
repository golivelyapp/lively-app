name: lively
description: Lively — dating app
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  supabase_flutter: ^2.5.6
  cached_network_image: ^3.4.0
  image_picker: ^1.1.2
  hive_flutter: ^1.1.0
  dio: ^5.5.0+1
  flutter_animate: ^4.5.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  freezed: ^4.0.0
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  # iOS is off until the Runner project's AppIcon.appiconset is set up
  # (Android alpha only for now — see CLAUDE.md § Platform).
  ios: false
  # 2026-09-02: switched to app_iconv2.png (updated Lively mark).
  image_path: "app_iconv2.png"
  min_sdk_android: 21
  # Adaptive icon: source PNG has a white ground behind the mark, so the
  # foreground and background both use white. The launcher clips it into
  # a circle/square per device style and the mark stays centered inside
  # the safe zone (~66% of the 108×108 dp canvas).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "app_iconv2.png"

flutter_native_splash:
  # OS-level launch screen — plays before Flutter draws its first frame.
  # `app_iconv2_splash.png` is a padded 2400×2400 canvas with the 1254×1254
  # source logo scaled to 900px and centered on white, so the mark sits
  # well inside the 66% safe zone Android 12+ applies via its circular
  # splash mask. Without the padding the logo edges get clipped.
  color: "#FFFFFF"
  image: "app_iconv2_splash.png"
  android: true
  ios: false
  android_12:
    color: "#FFFFFF"
    image: "app_iconv2_splash.png"
